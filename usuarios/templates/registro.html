{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'asseds/fonts/poppins/poppins.css'%}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'fonts/fontawesome-free-6.1.2-web/css/all.min.css'%}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/reset.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}"/>
    <script src="{% static 'js/registro.js' %}" defer></script>
  <title>Agrofit</title>
</head>

<body class="registro__body">

  <div class="registro__layout">
    <section class="registro__text">
      <div class="codigo_title-contenedor-4">
        <h1 class="codigo_title-4">Registro de Usuario</h1>
      </div>

      <div class="codigo-text_parrafo-4">
        <p class="codigo_parrafo-4">Completa con tus datos para ingresar al sistema agrofit</p>
      </div>
    </section>

    
    <section class="registro__content">
      <form method="post">
          {% csrf_token %}
        
      <div class="registro_inicio-nombre">
      <div class="registro__group">
        <input type="text" class="registro__input" name="nombres" required placeholder=" " />    
        <label for="nombre" class="registro__label">Nombres</label>
      </div>

      <div class="registro__group">
        <input type="text" class="registro__input" name="apellidos" required placeholder=" " />
        <label for="apellidos" class="registro__label">Apellidos</label>
      </div>

      <div class="registro__group">
        <input type="text" class="registro__input" name="telefono" required placeholder=" " />
        <label for="telefono" class="registro__label">Telefono</label>
      </div>

      </div>


      <div class="form-group">
        <select class="registro__select" id="tipo_documento" name="tipo_documento" required>
          <option class="editar__option" value="" disabled selected>Tipo de Documento</option>

          {% for t in tipos_documento %}
          <option value="{{ t.id }}">{{ t.nombre }}</option>
          {% endfor %}

        </select>
      </div>
      

      <div class="registro__group">
        <input type="text" class="registro__input" name="numero_documento" required placeholder=" " />
        <label for="documento" class="registro__label">Documento de Identidad</label>
      </div>

      <div class="registro__group">
        <input type="text" class="registro__input" name="correo" required placeholder=" " />
        <label for="email" class="registro__label">Correo Electronico, Sena o Soysena</label>
      </div>

      <div class="form__registro-info">
        <div class="form-group">
            <label for="fechaNacimiento" class="fecha-title">FECHA DE NACIMIENTO</label>
            <input type="date" class="botton-fecha" name="fechaNacimiento" />
        </div>
       </div>


       <div class="registro_inicio-medidas">
            <div class="form_group-info">
                <input type="text" class="registro__input" name="peso" placeholder=" " />
                <label for="peso" class="registro__label">Peso Kg</label>
            </div>

            <div class="form_group-info">
                <input type="text" class="registro__input" name="altura" placeholder=" " />
                <label for="altura" class="registro__label">Altura Cm</label>

           
            </div>
        </div>

         <div class="form_group-info">
                <input type="text" class="registro__input" name="grasaCorporal" placeholder=" " />
                <label for="grasaCorporal" class="registro__label">Grasa Corporal</label>
            </div>
      


      <div class="form-group">
        <label class="label-title">TIPO DE USUARIO</label>
        <div class="roles-container">

          {% for tu in tipos_usuario %}
            <label class="role-radio">
              <input type="radio" name="rol" value="{{ tu.nombre }}" required>
              <span class="registro__botton">{{ tu.nombre }}</span>
            </label>
          {% endfor %}
          
        </div>
      </div>

    

  


      <div id="seccionFicha" class="registro__group" style="display: none;">
        <input type="text" class="registro__input" name="numeroFicha" placeholder=" " />
        <!-- crear campos interactivos dentro de un formulario-->
        <!--required obliga al usuario a llenar el campo y placeholder muestra un texto dentro de la tabla vacia-->
        <label for="numeroFicha" class="registro__label">Numero de Ficha</label>
      </div>

      

      <div class="form-group" id="grupoTipoContrato">
        <label class="label-title" for="tipoContrato">TIPO DE CONTRATO</label>
        <div>
           {% for contrato in tipos_contrato %}
              <label class="grupoTipoContrato">
                <input class="registro_contrato-botton" type="radio" name="tipoContrato" value="{{ contrato.nombre }}" onchange="toggleCamposContrato()"> {{ contrato.nombre }}
              </label>
          {% endfor %}
      </div>
      </div>


      
     


      <!-- Sección condicional (oculta por defecto) -->
      <div id="seccionContrato" class="registro__contrato">
        <div class="contrato__fecha">

          <div class="form-group">
            <label for="fechaInicio" class="label-title">FECHA DE INICIO</label>
            <input type="date" class="registro__botton-fecha" name="fechaInicio" />
          </div>

          <div class="form-group">
            <label for="fechaFin" class="label-title">FECHA DE FIN</label>
            <input type="date" class="registro__botton-fecha" name="fechaFin" />
          </div>
        </div>

        <div class="registro__group">
          <input type="text" class="registro__input" name="numeroContrato" placeholder=" " />
          <label for="numeroContrato" class="registro__label">Numero de Contrato</label>
        </div>
      </div>



      


      


      <div class="form-group">
        <select class="registro__select-centro" id="tipo_documento" name="centro" required>
          <option class="editar__option" value="" disabled selected>Centro de Formación</option>

          {% for c in centros %}
          <option value="{{ c.id }}">{{ c.nombre }}</option>
          {% endfor %}

        </select>
      </div>


      <div class="form-group" id="seccionDependencia">
        <select class="registro__select" name="dependencia">
            <option value="" disabled selected>Dependencia</option>
            {% for d in dependencias %}
            <option value="{{ d.id }}">{{ d.nombre }}</option>
            {% endfor %}
        </select>
      </div>


      <div class="registro__group" id="seccionEspecialidad" style="display: none;">
          <input type="text" class="registro__input" name="especialidad" placeholder=" " />
          <label for="especialidad" class="registro__label">Especialidad</label>
      </div>



      <div class="registro__group" id="seccionPassword">
        <input type="password" class="registro__input" name="password" required placeholder=" " />
        <label for="password" class="registro__label">contraseña</label>
      </div>

      <button type="submit" class="form__button">Registrar Usuario</button>
      <div class="form_icon-button">
        <i class="icon_button fa solid fa-user-plus"></i>
      </div>
      </form>
    </section>
  </div>
</body>

</html>
